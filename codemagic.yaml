workflows:
  ios-unsigned:
    name: Unity iOS - Unsigned IPA
    instance_type: mac_mini_m2
    max_build_duration: 120
    environment:
      xcode: "16.4"
      vars:
        # Path relative to the repository root. The script also detects a single
        # Unity-iPhone.xcodeproj in a subfolder if this default is not found.
        XCODE_PROJECT: "Unity-iPhone.xcodeproj"
        XCODE_SCHEME: "Unity-iPhone"
        XCODE_CONFIGURATION: "Release"
    scripts:
      - name: Download Git LFS libraries
        script: |
          #!/usr/bin/env bash
          set -euo pipefail
          cd "$CM_BUILD_DIR"
          git lfs install --local --skip-smudge
          git lfs pull
      - name: Build unsigned iOS app and package IPA
        script: |
          #!/usr/bin/env bash
          exec bash "$CM_BUILD_DIR/scripts/build-unsigned-ipa.sh"
    artifacts:
      - build/ios-unsigned/*-unsigned.ipa
      - build/ios-unsigned/xcodebuild.log
      - build/ios-unsigned/DerivedData/Build/Products/**/*.dSYM
